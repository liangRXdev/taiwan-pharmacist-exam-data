[project]
name = "tped"
version = "0.1.0"
description = "考選部藥師國考題庫結構化管線（純規則式、可稽核）"
authors = [
    { name = "lianggaga927-beep", email = "lianggaga.927@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.13.0",
    "requests>=2.34.2",
]

[project.scripts]
tped = "tped:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
